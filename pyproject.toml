[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sern-mil"
version = "0.3.0"
description = "Selective embedding retrieval and nuclei-feature regional MIL for prostate grading"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "PyYAML>=6.0",
  "numpy>=1.24,<2",
  "h5py>=3.10",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "Pillow>=10.0",
  "opencv-python-headless>=4.9,<4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9.0"]
dl = ["torch>=2.2", "torchvision>=0.17"]
pathology = ["openslide-python>=1.3", "openslide-bin>=4.0"]

[project.scripts]
sern-mil = "sern_mil.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
